services:
  - type: web
    name: mo7mels
    env: node
    plan: free
    envVars:
      - key: SITE_URL
        value: https://mo7mels.com
      - key: SITE_NAME
        value: Mo7mels
      - key: SITE_LOGO_URL
        value: https://mo7mels.com/site-logo.svg
      - key: ENABLE_CANONICAL_REDIRECT
        value: "true"
      - key: VITE_MAINTENANCE_MODE
        value: "false"
      - key: VITE_MAINTENANCE_TITLE
        value: "نعتذر لإزعاجك"
      - key: VITE_MAINTENANCE_MESSAGE
        value: "الموقع حالياً يخضع لرفع تحديثات. سنعود قريباً بخدمة أفضل. شكراً لصبرك."
      - key: VITE_LINKEDIN_URL
        value: "https://www.linkedin.com/company/mo7mels"
      - key: DATABASE_URL
        sync: false
      - key: OTP_DEBUG
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Mo7mels <no-reply@mo7mels.com>"
      - key: RESEND_API_KEY
        sync: false
    buildCommand: npm install && npm run build
    startCommand: npm start