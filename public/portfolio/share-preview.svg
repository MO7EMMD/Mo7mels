    <text x="64" y="574" fill="#bbff6a" font-size="21" font-weight="500">mo7mels.com/portfolio</text>
    <text x="1136" y="573" fill="#a3b0a6" text-anchor="end" font-size="17">Explore my work. Let’s connect.</text>
