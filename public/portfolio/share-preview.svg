    <text x="1136" y="73" fill="#9ba89d" text-anchor="end" font-size="15" letter-spacing="2">CREATE. BUILD. EXPLORE.</text>
    <text x="60" y="251" fill="#eff4f0" font-size="112" font-weight="800" letter-spacing="-8">mo<tspan fill="#bbff6a">7</tspan>mels</text>
    <path d="M66 279H189" stroke="#bbff6a" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="344" fill="#eff4f0" font-size="39" font-weight="600" letter-spacing="-1">Digital creator &amp; builder.</text>
    <text x="64" y="395" fill="#a3b0a6" font-size="24">Thoughtful tools and ideas for the internet.</text>
