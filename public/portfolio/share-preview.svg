<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">mo7mels — Digital creator and builder</title>
  <desc id="description">Web projects, creator tools and open source. Explore mo7mels.com/portfolio.</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#334f29" stop-opacity=".7"/>
      <stop offset="1" stop-color="#080b0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d1ff9b"/>
      <stop offset=".3" stop-color="#72b85d"/>
      <stop offset=".68" stop-color="#183e2a"/>
      <stop offset="1" stop-color="#080f0a"/>
    </linearGradient>
    <clipPath id="orb-clip"><circle cx="985" cy="280" r="130"/></clipPath>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#bbff6a" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#080b0a"/>
